scenes:
  - name: "The Great Owl's Hollow"
    slug: "great-owl-hollow"
    logline: "Mrs. Brisby's terrifying pilgrimage to the ancient owl's hollow tree, where counsel is given amid bones and moonlight"
    backgrounds:
      - key: "hollow-interior"
        description: "the cavernous interior of an ancient hollow oak at night: gnarled curved bark walls ribbed like a gothic nave, a floor littered with tiny rodent bones, dried husks, and owl pellets, cobweb veils hanging from above, deep knotholes receding into pitch black"
        lighting: "one cold shaft of moonlight spearing down through a crack in the trunk as the single dominant practical source, with deep indigo and slate-purple shadows carrying blood-crimson and magenta accents (the Immediate Danger palette), faint icy-cyan edge light on bark ridges"
        mood: "immediate danger and mortality; reverent dread before an ancient predator"
      - key: "forest-approach"
        description: "the night forest floor approaching the hollow oak: the tree looms as a towering twisted monolith seen from mouse height, overgrown thorn bushes and tangled roots framing the view, giant mushrooms and dew-covered grass blades, drifting ground mist"
        lighting: "cold moonlight backlighting the oak's silhouette as the single dominant practical source, deep indigo and slate-purple shadows with faint crimson accents, thin fog catching the light in volumetric layers"
        mood: "vulnerability at small scale; a tiny pilgrim before a looming sacred terror"

  - name: "Mr. Ages' Apothecary"
    slug: "mr-ages-apothecary"
    logline: "the cluttered hermit den where Mr. Ages brews remedies among towering glass jars and dried herbs"
    backgrounds:
      - key: "apothecary-interior"
        description: "a cluttered apothecary den burrowed under roots: giant found objects repurposed as furniture (a glass canning jar as a cupboard, a rusted thimble as a pot, a spool as a table), hanging bundles of dried herbs, shelves of corked bottles, scattered parchment scraps, arched root ceiling"
        lighting: "one amber oil lantern on the workbench as the single dominant practical source, warm gold highlights against deep teal and indigo shadows in the background jars, soft airbrushed glow around the flame, floating dust motes"
        mood: "ancient alchemy and intellectual mystery; cozy but reclusive"

  - name: "Brisby Cinderblock Home"
    slug: "brisby-cinderblock-home"
    logline: "the warm, cramped cinderblock burrow where the Frisby family shelters from the coming plow"
    backgrounds:
      - key: "burrow-interior"
        description: "a cozy cinderblock home interior at mouse scale: rough concrete block walls with arched nooks, a scrap of red fabric as a curtain, a spool bed with patchwork bedding, a bottle-cap table, stored seeds and a cracked teacup, roots poking through the ceiling"
        lighting: "one amber oil lantern as the single dominant practical source, rich ochres, terracotta, and candlelight golds against deep umber and teal shadows (the Sanctuary palette), gentle bloom around the flame, floating dust motes"
        mood: "sanctuary and safety; a small pocket of warmth inside overwhelming darkness"
