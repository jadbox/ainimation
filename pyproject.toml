[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "animation-pipeline"
version = "0.1.0"
description = "Film-agnostic art pipeline for generating character blueprints, scene background plates, scene scripts, and animated clips from per-film movie.yml configuration."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "requests>=2.28.0",
]

[project.scripts]
generate-blueprint = "blueprint:main"
generate-character = "blueprint:main"
scriptgen = "scriptgen:main"
scene-script = "scriptgen:main"
animator = "animator:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["blueprint", "scriptgen", "animator"]

[tool.setuptools.packages.find]
where = ["src"]
