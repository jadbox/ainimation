    species: "field mouse"
    identity: "a widowed field mouse and the story's determined protagonist, seeking a way to save her sick son Timothy"
    appearance: "dusty mauve-brown fur with a cream muzzle and chest, blue-violet eyes, pink ears and nose, oversized salmon-pink ear interiors with subtle inner rim shading, short cream muzzle, small wet pink nose with a bright highlight dot, long drooping whiskers, small four-fingered pale hands held near the chest, anxious upright posture"
    garment: "a tattered red hooded cape with a frayed zigzag hem and a few large heavy folds"
    staging: "mouse eye level inside a cozy cinderblock home burrow: one amber oil lantern is the sole dominant practical source, with deep teal and indigo shadows, a continuous cool-gold rim light, floating dust motes, and soft focus roots and household objects occluding roughly one quarter of the frame edges"
    pose_mood: "anxious but determined, hands held near the chest, reading as a real animal first and a person second"
