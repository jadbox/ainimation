movie:
  title: "The Rats of NIMH"
  adaptation: "a short film adaptation of The Rats of NIMH"
  style: "Don Bluth's iconic 1980s dark fantasy feature animation style (e.g., The Secret of NIMH, 1982)"
  style_summary: >-
    hand-painted 2D cel animation clip in the style of a 1982 Don Bluth feature (The Secret of NIMH):
    hand-inked tapered lines, 2-tone cel shading, painterly gouache backgrounds,
    warm amber key light against deep teal/indigo shadow, 360-degree rim lighting,
    heavy vignette, soft-focus dark foreground occlusion on 20-30% of the frame
    borders, film grain.
  camera_rules: "Keep the camera at rodent eye-level (2-12 inches high) around a single dominant practical light source."
  hard_direction_rules:
    - "Camera height stays at rodent eye-level (2-12 inches above ground) unless a shot is deliberately a predator POV. Environments dominate ~70% of frame volume; characters occupy the lower third."
    - "Every shot orbits a single identifiable practical light source (candle, lantern, amulet glow, moonlight shaft). 60-70% of the frame sits in deep shadow."
    - "Warm key light (amber/gold, 2000K-3200K) against cool ambient shadow (teal/indigo/slate purple, 7000K-10000K). 360-degree rim lighting separates character silhouettes from dark backgrounds."
    - "Soft-focus dark foreground elements (roots, vines, cobwebs, cracked glass) obscure 20-30% of frame borders for a 'peeping into a secret world' feel."
    - "Animation mechanics: animating on twos (12fps) for dialogue/moderate motion, on ones (24fps) for action climaxes; deep anticipation crouches before major actions; heavy recoil on landing; drag and follow-through on ears, whiskers, tails, and capes; held emotional poses with micro-movements (trembling fingers, double-blinks, chest breathing, whisker twitches)."
    - "Spatial & Movement Continuity: STRICTLY NO teleporting, sudden position pops, fading in/out of character locations, or duplicate/ghost character instances. Any character or item changing position or facing direction MUST move through physical space with proper, continuous locomotion (turning, stepping, walking, pivoting, climbing)."
    - "Tone: cozy danger, reverence and awe, vulnerability at small scale, storybook gothic."
    - "Sound and music must match the register: hushed, tender, mournful; sparse orchestration with music-box/celesta colors for sanctuary, low strings and choir for awe, percussive dread for danger."

characters:
  - name: "Mrs Brisby"
    species: "field mouse"
    identity: "a widowed field mouse and the story's determined protagonist, seeking a way to save her sick son Timothy"
    appearance: "dusty mauve-brown fur with a cream muzzle and chest, blue-violet eyes, pink ears and nose, oversized salmon-pink ear interiors with subtle inner rim shading, short cream muzzle, small wet pink nose with a bright highlight dot, long drooping whiskers, small four-fingered pale hands; wearing a tattered red hooded cape with a frayed zigzag hem; anxious but determined posture with hands held near the chest"
    voice: "soft, medium-high pitch; tremulous, earnest, and breathless style with emotional warmth and maternal determination; gentle Mid-Atlantic accent"
    avoid: "clean vector lines, smooth plastic rendering, modern clothing, a human body shape, flat lighting, extra limbs, duplicate garments, text, watermarks, and logos"

