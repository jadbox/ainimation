[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nimh-character-generator"
version = "0.1.0"
description = "Art pipeline for generating Don Bluth style character blueprints, scene background plates, scene scripts, and animated clips for the Rats of NIMH project."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "Pillow>=10.0.0",
    "requests>=2.28.0",
]

[project.scripts]
generate-blueprint = "blueprint_generator.generate:main"
generate-character = "blueprint_generator.generate:main"
scene-script = "scene_script:main"
animator = "animator:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["scene_script", "animator"]

[tool.setuptools.packages.find]
where = ["src"]
